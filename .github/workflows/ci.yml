name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check node version
        run: node --version

      - name: Syntax-check demo app
        run: node --check docs/app.js

      - name: Run tests
        run: npm test

      - name: Run smoke checks
        run: npm run smoke
